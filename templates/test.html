  <!DOCTYPE HTML>
  <html>
  <head>
  <link href="/statics/css/maps.css?202005042" rel="stylesheet">
  <script type='text/javascript' src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.2/jquery.min.js'></script>
  </head>
  <body>
  <div id="main">
  <a href='/week/{{week.id}}'>< Retour à la liste des mots de la semaine</a>
  <h1 class="card">Ton entrainement:</h1>
  <div id="confettiBox"  class="card">
  <ul>
  {% for word in words %}
  <li id="{{word.id}}" class="hidden"><p>
  <audio controls id="audio{{word.id}}"
src="/statics/son/{{word.id}}.wav" ></audio>

  <button class="play" onclick="play({{word.id}})"></button><br/>
  <input id="verif{{word.id}}"
value="{{word.name}}" class="hidden">
  <input id="mot{{word.id}}">
  <button  id="button{{word.id}}" class="btn btn-success centered"
onclick="check({{word.id}})">Vérifier</button>
  <div id="success{{word.id}}" class="icon-wrap hidden">
    <svg class="success-svg" viewBox="0 0 100 100" width="120" height="120">
      <circle class="success-circle" cx="50" cy="50" r="40" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"></circle>
      <polyline class="success-check" points="35 50 45 60 65 40" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></polyline>
    </svg>
  </div>
  <span id="wrong{{word.id}}" class="hidden wrong">Dommage
!</span>
  <button id="next{{word.id}}" class="hidden" onclick="next({{word.id}})">Prochain mot</button>
  </p></li>
  {% endfor %}
  <li class="hidden">
  <img class="play" src="/statics/nice.gif"></img><br/>
  <progress id="progress" class="max="{{words|length}}" value="0"></progress>
  <a href='/week/{{week.id}}'>Retour à la liste des mots de la semaine</a>
  </li>
</ul>
  </div>
  </div>
  </body>
  <script>
  $("input").keyup(function(event) {
    if (event.keyCode === 13) {
      id = event.currentTarget.id
      $('#'+id.replace('mot', 'button')).click();
    }
  });


function play(wordId){
  document.getElementById('audio'+wordId).play()
  document.getElementById('mot'+wordId).focus()

}
function next(wordId){
  currentLi = document.getElementById(wordId)
  currentLi.style.display = 'none';
  currentLi.nextElementSibling.style.display = 'inline';
  play(currentLi.nextElementSibling.id)
}

function check(wordId){
  document.getElementById('button'+wordId).style.display = 'none';
  mot=document.getElementById('mot'+wordId).value
  verif=document.getElementById('verif'+wordId).value
  if (mot.trim().toUpperCase()===verif.trim().toUpperCase()){
    $.ajax({
      type: "POST",
      url: "/validateWord/"+wordId,
      dataType: "json",
      traditional: true,
      success: function(data){
        createConfetti()

        document.getElementById('success'+wordId).style.display = 'inline';
        currentLi = document.getElementById(wordId)
        document.getElementById("progress").value = document.getElementById("progress").value+1
        setTimeout(function(){currentLi.style.display = 'none';},2000);
        setTimeout(function(){currentLi.nextElementSibling.style.display = 'inline';},2000);
        setTimeout(function(){play(currentLi.nextElementSibling.id)},2400);
      }
    });
  } else {
    $.ajax({
      type: "POST",
      url: "/unvalidateWord/"+wordId,
      dataType: "json",
      traditional: true,
      success: function(data){
        setTimeout(function(){document.getElementById('audio'+wordId).style.display = 'none';},700);
        setTimeout(function(){document.getElementById('verif'+wordId).style.display = 'inline';},700);
        document.getElementById('wrong'+wordId).style.display = 'inline';
        setTimeout(function(){document.getElementById('next'+wordId).style.display = 'inline';},700);
      }
    });
  }
}

function createConfetti() {
  const container = document.getElementById('confettiBox');
  const colors = [
    '#6366f1', '#8b5cf6', '#d946ef',
    '#f59e0b', '#10b981', '#ef4444'
  ];

  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = Math.random() * 8 + 6;
    const left = Math.random() * 100;
    const delay = Math.random() * 0.5;
    const duration = 2 + Math.random() * 2;

    confetti.style.cssText = `
      position: absolute;
      width: ${size}px;
      height: ${size}px;
      background: ${color};
      left: ${left}%;
      top: 0;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      animation: confettiFall ${duration}s ease-out
                 ${delay}s forwards;
    `;

    container.appendChild(confetti);
    setTimeout(() => confetti.remove(), 4500);
  }
}
$(document).ready(function(){
  document.getElementById({{words[0].id}}).style.display = 'inline';
  document.getElementById('audio{{words[0].id}}').play()
});
</script>
